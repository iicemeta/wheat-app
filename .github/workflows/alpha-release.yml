name: Alpha Release

# Manual trigger: Actions -> Alpha Release -> Run workflow.
# No version tags required: each run auto-publishes v0.<run_number>.0-alpha.
# Stable releases: push a v* tag (e.g. v1.0.0) to publish a non-prerelease via the same flow.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            PRERELEASE=false
          else
            VERSION_NAME="0.${GITHUB_RUN_NUMBER}.0-alpha"
            PRERELEASE=true
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION_NAME} (${VERSION_CODE}), prerelease=${PRERELEASE}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "platform-tools" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PversionCode=${{ steps.version.outputs.version_code }}
          -PversionName=${{ steps.version.outputs.version_name }}

      - name: Rename artifact
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          DST="app/build/outputs/apk/release/com.iicemeta.wheat.apk"
          mv "$SRC" "$DST"
          echo "APK=$DST" >> "$GITHUB_ENV"
          ls -lh "$DST"

      - name: Publish GitHub Release (Alpha)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Wheat Alpha ${{ steps.version.outputs.version_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ env.APK }}
